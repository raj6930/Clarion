version: "3.9"

# ═══════════════════════════════════════════════════════
# Clarion — Intelligent Support Analytics Platform
# Docker Compose — V1 Local Deployment
# ═══════════════════════════════════════════════════════

services:
  # ─── Frontend (React SPA via nginx) ───
  clarion-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clarion-frontend
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      clarion-api:
        condition: service_healthy
    networks:
      - clarion-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
    restart: unless-stopped

  # ─── Backend API (FastAPI) ───
  clarion-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clarion-api
    env_file: .env
    depends_on:
      clarion-db:
        condition: service_healthy
      clarion-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - clarion-net
    volumes:
      - clarion-uploads:/app/uploads
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
    restart: unless-stopped

  # ─── Celery Worker (async tasks) ───
  clarion-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clarion-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    env_file: .env
    depends_on:
      clarion-api:
        condition: service_healthy
    networks:
      - clarion-net
    volumes:
      - clarion-uploads:/app/uploads
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2"
    restart: unless-stopped

  # ─── Celery Beat (scheduled tasks) ───
  clarion-scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clarion-scheduler
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      clarion-api:
        condition: service_healthy
    networks:
      - clarion-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
    restart: unless-stopped

  # ─── PostgreSQL Database ───
  clarion-db:
    image: postgres:16-alpine
    container_name: clarion-db
    environment:
      POSTGRES_DB: ${CLARION_DB_NAME:-clarion}
      POSTGRES_USER: ${CLARION_DB_USER:-clarion}
      POSTGRES_PASSWORD: ${CLARION_DB_PASSWORD:?Database password required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CLARION_DB_USER:-clarion}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - clarion-db-data:/var/lib/postgresql/data
    networks:
      - clarion-net
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2"
    restart: unless-stopped

  # ─── Redis (cache + message broker) ───
  clarion-redis:
    image: redis:7-alpine
    container_name: clarion-redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - clarion-redis-data:/data
    networks:
      - clarion-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
    restart: unless-stopped

  # ─── Ollama (local LLM serving) ───
  clarion-ollama:
    image: ollama/ollama:latest
    container_name: clarion-ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - clarion-ollama-models:/root/.ollama
    networks:
      - clarion-net
    deploy:
      resources:
        limits:
          memory: 10G
          cpus: "6"
    restart: unless-stopped

networks:
  clarion-net:
    driver: bridge

volumes:
  clarion-db-data:
    name: clarion-db-data
  clarion-redis-data:
    name: clarion-redis-data
  clarion-ollama-models:
    name: clarion-ollama-models
  clarion-uploads:
    name: clarion-uploads
