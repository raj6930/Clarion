# ═══════════════════════════════════════════════════════
# Clarion — Local Development Docker Compose
# Start: docker compose up -d
# Logs:  docker compose logs -f clarion-api
# Stop:  docker compose down
# Reset: docker compose down -v  (deletes all data)
# ═══════════════════════════════════════════════════════

services:
  # ─── PostgreSQL Database ───
  clarion-db:
    image: postgres:16-alpine
    container_name: clarion-db
    environment:
      POSTGRES_DB: ${CLARION_DB_NAME:-clarion}
      POSTGRES_USER: ${CLARION_DB_USER:-clarion}
      POSTGRES_PASSWORD: ${CLARION_DB_PASSWORD:?Set CLARION_DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CLARION_DB_USER:-clarion}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - clarion-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - clarion-net
    restart: unless-stopped

  # ─── Redis (cache + message broker) ───
  clarion-redis:
    image: redis:7-alpine
    container_name: clarion-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - clarion-redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - clarion-net
    restart: unless-stopped

  # ─── Backend API (FastAPI) ───
  clarion-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clarion-api
    env_file: .env
    depends_on:
      clarion-db:
        condition: service_healthy
      clarion-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro
    networks:
      - clarion-net
    restart: unless-stopped

  # ─── Frontend (React SPA via nginx) ───
  clarion-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clarion-frontend
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      clarion-api:
        condition: service_healthy
    networks:
      - clarion-net
    restart: unless-stopped

networks:
  clarion-net:
    driver: bridge

volumes:
  clarion-db-data:
    name: clarion-db-data
  clarion-redis-data:
    name: clarion-redis-data
