name: Clarion CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ─── Backend Lint ───
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check backend/
      - run: ruff format --check backend/

  # ─── Backend Unit Tests ───
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clarion_test
          POSTGRES_USER: clarion_test
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Run unit tests
        env:
          CLARION_DB_HOST: localhost
          CLARION_DB_PORT: 5432
          CLARION_DB_NAME: clarion_test
          CLARION_DB_USER: clarion_test
          CLARION_DB_PASSWORD: test_password
          CLARION_REDIS_URL: redis://localhost:6379/0
          CLARION_JWT_SECRET: test-jwt-secret-key
          CLARION_ENVIRONMENT: test
        run: |
          cd backend
          pytest tests/unit/ -v --cov=app --cov-report=term-missing --cov-fail-under=80

  # ─── Contract Tests ───
  backend-contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Run contract tests
        env:
          CLARION_DB_PASSWORD: unused
          CLARION_JWT_SECRET: unused
        run: |
          cd backend
          pytest tests/contracts/ -v

  # ─── Anonymisation Tests ───
  backend-anonymisation-tests:
    name: Anonymisation Tests (Zero Tolerance)
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm
      - name: Run anonymisation tests
        env:
          CLARION_DB_PASSWORD: unused
          CLARION_JWT_SECRET: unused
        run: |
          cd backend
          pytest tests/anonymisation/ -v --tb=long

  # ─── Security Scan ───
  backend-security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install tools
        run: pip install pip-audit bandit
      - name: Dependency audit
        run: |
          cd backend
          pip-audit -r requirements.txt
      - name: SAST scan
        run: |
          cd backend
          bandit -r app/ -c pyproject.toml || true

  # ─── Frontend Lint & Test ───
  frontend-lint-test:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Lint
        run: |
          cd frontend
          npm run lint
      - name: Test
        run: |
          cd frontend
          npm run test -- --coverage --watchAll=false
      - name: Security audit
        run: |
          cd frontend
          npm audit --audit-level=high || true

  # ─── Docker Build ───
  docker-build:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, backend-contract-tests, frontend-lint-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t clarion-api:test ./backend
      - name: Build frontend image
        run: docker build -t clarion-frontend:test ./frontend
      - name: Verify images
        run: |
          docker images | grep clarion
