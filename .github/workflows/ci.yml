name: Clarion CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check backend/app/ backend/tests/ --config backend/pyproject.toml
      - run: ruff format --check backend/app/ backend/tests/ --config backend/pyproject.toml

  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd backend
          pip install fastapi pydantic pydantic-settings uvicorn "python-jose[cryptography]" "passlib[bcrypt]" bcrypt==4.0.1 httpx email-validator sqlalchemy pytest pytest-asyncio pytest-cov
      - name: Run unit tests
        env:
          CLARION_DB_PASSWORD: test
          CLARION_JWT_SECRET: test-jwt-secret-key
          CLARION_ENVIRONMENT: test
        run: |
          cd backend
          pytest tests/unit/ -v --tb=short

  backend-contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd backend
          pip install fastapi pydantic pydantic-settings uvicorn "python-jose[cryptography]" "passlib[bcrypt]" bcrypt==4.0.1 httpx email-validator sqlalchemy pytest
      - name: Run contract tests
        env:
          CLARION_DB_PASSWORD: test
          CLARION_JWT_SECRET: test-jwt-secret-key
          CLARION_ENVIRONMENT: test
        run: |
          cd backend
          pytest tests/contracts/ -v --tb=short

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps
      - name: Build
        run: |
          cd frontend
          npm run build || true
